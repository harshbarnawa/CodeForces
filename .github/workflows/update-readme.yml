name: Validate README

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify README is up to date
        run: |
          cp README.md README_backup.md
          python script.py
          if ! diff -q README.md README_backup.md > /dev/null 2>&1; then
            echo "README.md is out of date! Run 'python script.py' locally and commit."
            exit 1
          fi
          echo "README.md is up to date."
